server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React/Vite frontend calls /api/* with fetch().
    # In Compose, "backend" is the Spring Boot service name.
    # Use Docker's embedded DNS resolver + a variable so nginx re-resolves "backend" instead of caching a stale IP if the backend container restarts.
    # NOTE: proxy_pass has NO path component here. When proxy_pass uses a variable, nginx does not strip the matched location prefix from the request URI - it appends the full original URI after the proxy_pass value. Adding a literal "/api/" here would double up to "/api/api/...".
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # React Router fallback: /login, /app/assets, /app/reports should all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
