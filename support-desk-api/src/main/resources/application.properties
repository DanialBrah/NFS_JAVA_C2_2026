spring.application.name=support-desk-api

server.port=${SERVER_PORT:8081}

spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=${MONGODB_DATABASE:support_desk_db}
spring.mongodb.authentication-database=${MONGODB_AUTHENTICATION_DATABASE:support_desk_db}
spring.mongodb.username=${MONGODB_USERNAME}
spring.mongodb.password=${MONGODB_PASSWORD}

spring.data.mongodb.auto-index-creation=true

spring.jackson.serialization.indent-output=true

spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

logging.level.root=INFO
logging.level.com.example.supportdesk=INFO
